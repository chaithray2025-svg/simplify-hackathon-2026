[project]
name = "simplifynext"
version = "0.1.0"
description = "Review Handler AI Employee for small F&B business owners in Singapore (hackathon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
aws = [
    # Only needed if you provision real DynamoDB/S3 from Python instead of the console/CLI.
    "boto3-stubs[dynamodb,s3,bedrock-runtime]>=1.35.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
simplifynext = "simplifynext.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simplifynext"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
